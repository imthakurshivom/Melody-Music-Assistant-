name: Build Melody Music Assistant APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Create Android Project
        shell: bash
        run: |

          mkdir -p app/src/main/java/com/shivom/melody
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # -----------------------------
          # settings.gradle
          # -----------------------------

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Melody"
          include(":app")
          EOF


          # -----------------------------
          # Root build.gradle
          # -----------------------------

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


          # -----------------------------
          # App build.gradle
          # -----------------------------

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.shivom.melody'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.shivom.melody'

                  minSdk 26

                  targetSdk 35

                  versionCode 3

                  versionName '0.3'
              }
          }
          EOF


          # -----------------------------
          # Theme
          # -----------------------------

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:statusBarColor">#0B0D12</item>

                  <item name="android:navigationBarColor">#0B0D12</item>

                  <item name="android:windowLightStatusBar">false</item>

                  <item name="android:colorAccent">#B8C7FF</item>

              </style>

          </resources>
          EOF


          # -----------------------------
          # Melody App Icon
          # -----------------------------

          cat > app/src/main/res/drawable/ic_melody.xml <<'EOF'
          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#7C4DFF"
                  android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M64,25L64,67.5C61,65.3 57.2,64 53,64C45.3,64 39,68.3 39,73.5C39,78.7 45.3,83 53,83C60.7,83 67,78.7 67,73.5L67,40L82,35L82,24L64,25Z"/>

          </vector>
          EOF


          # -----------------------------
          # AndroidManifest.xml
          # -----------------------------

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.RECORD_AUDIO"/>

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE"/>

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>

              <application

                  android:theme="@style/AppTheme"

                  android:label="Melody"

                  android:icon="@drawable/ic_melody"

                  android:allowBackup="true"

                  android:supportsRtl="true">

                  <activity

                      android:name=".MainActivity"

                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN"/>

                          <category
                              android:name="android.intent.category.LAUNCHER"/>

                      </intent-filter>

                  </activity>


                  <service

                      android:name=".MelodyService"

                      android:exported="false"

                      android:foregroundServiceType="microphone"/>


                  <service

                      android:name=".MusicNotificationService"

                      android:label="Melody Music Control"

                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"

                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.service.notification.NotificationListenerService"/>

                      </intent-filter>

                  </service>

              </application>

          </manifest>
          EOF


          # =====================================================
          # MusicNotificationService.java
          # =====================================================

          cat > app/src/main/java/com/shivom/melody/MusicNotificationService.java <<'EOF'
          package com.shivom.melody;

          import android.service.notification.NotificationListenerService;
          import android.content.ComponentName;
          import android.media.session.MediaController;
          import android.media.session.MediaSessionManager;
          import android.view.KeyEvent;

          import java.util.List;

          public class MusicNotificationService
                  extends NotificationListenerService {

              private static MusicNotificationService instance;

              @Override
              public void onListenerConnected() {

                  super.onListenerConnected();

                  instance = this;
              }

              @Override
              public void onListenerDisconnected() {

                  instance = null;

                  super.onListenerDisconnected();
              }

              public static boolean isConnected() {

                  return instance != null;
              }

              public static boolean sendCommand(int keyCode) {

                  if (instance == null)
                      return false;

                  try {

                      MediaSessionManager manager =
                          (MediaSessionManager)
                          instance.getSystemService(
                              MEDIA_SESSION_SERVICE
                          );

                      ComponentName component =
                          new ComponentName(
                              instance,
                              MusicNotificationService.class
                          );

                      List<MediaController> sessions =
                          manager.getActiveSessions(component);

                      if (sessions == null ||
                          sessions.isEmpty()) {

                          return false;
                      }

                      MediaController controller =
                          sessions.get(0);

                      long now =
                          android.os.SystemClock.uptimeMillis();

                      KeyEvent down =
                          new KeyEvent(
                              now,
                              now,
                              KeyEvent.ACTION_DOWN,
                              keyCode,
                              0
                          );

                      KeyEvent up =
                          new KeyEvent(
                              now,
                              now + 50,
                              KeyEvent.ACTION_UP,
                              keyCode,
                              0
                          );

                      controller.dispatchMediaButtonEvent(down);

                      controller.dispatchMediaButtonEvent(up);

                      return true;

                  } catch (Exception e) {

                      return false;
                  }
              }
          }
          EOF


          # =====================================================
          # MelodyService.java
          # =====================================================

          cat > app/src/main/java/com/shivom/melody/MelodyService.java <<'EOF'
          package com.shivom.melody;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;

          import android.content.Intent;

          import android.media.AudioManager;

          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;

          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;

          import java.util.ArrayList;
          import java.util.Locale;

          public class MelodyService extends Service {

              private SpeechRecognizer recognizer;

              private boolean waitingForWake = true;

              private boolean listening = false;

              private Handler handler;


              @Override
              public void onCreate() {

                  super.onCreate();

                  handler =
                      new Handler(
                          Looper.getMainLooper()
                      );

                  createNotificationChannel();

                  Notification.Builder builder;

                  if (Build.VERSION.SDK_INT >= 26) {

                      builder =
                          new Notification.Builder(
                              this,
                              "melody"
                          );

                  } else {

                      builder =
                          new Notification.Builder(this);
                  }

                  Notification notification =
                      builder

                          .setContentTitle("Melody")

                          .setContentText(
                              "Listening for Hey Melody"
                          )

                          .setSmallIcon(
                              android.R.drawable.ic_btn_speak_now
                          )

                          .build();

                  startForeground(
                      10,
                      notification
                  );

                  startWakeListening();
              }


              private void createNotificationChannel() {

                  if (Build.VERSION.SDK_INT >= 26) {

                      NotificationChannel channel =
                          new NotificationChannel(
                              "melody",
                              "Melody",
                              NotificationManager.IMPORTANCE_LOW
                          );

                      NotificationManager manager =
                          getSystemService(
                              NotificationManager.class
                          );

                      manager.createNotificationChannel(
                          channel
                      );
                  }
              }


              private void startWakeListening() {

                  waitingForWake = true;

                  startRecognition();
              }


              private void startCommandListening() {

                  waitingForWake = false;

                  stopRecognition();

                  handler.postDelayed(
                      () -> startRecognition(),
                      400
                  );
              }


              private void startRecognition() {

                  if (!SpeechRecognizer
                      .isRecognitionAvailable(this)) {

                      return;
                  }

                  stopRecognition();

                  recognizer =
                      SpeechRecognizer
                          .createSpeechRecognizer(this);

                  recognizer.setRecognitionListener(
                      new RecognitionListener() {

                          @Override
                          public void onResults(
                              android.os.Bundle bundle) {

                              listening = false;

                              ArrayList<String> results =
                                  bundle.getStringArrayList(
                                      SpeechRecognizer
                                          .RESULTS_RECOGNITION
                                  );

                              String text = "";

                              if (results != null &&
                                  !results.isEmpty()) {

                                  text =
                                      results
                                          .get(0)
                                          .toLowerCase(
                                              Locale.ROOT
                                          );
                              }


                              if (waitingForWake) {

                                  if (
                                      text.contains(
                                          "hey melody"
                                      )
                                  ) {

                                      startCommandListening();
                                  }
                                  else {

                                      restartWake();
                                  }

                                  return;
                              }


                              executeCommand(text);

                              restartWake();
                          }


                          @Override
                          public void onError(int error) {

                              listening = false;

                              restartWake();
                          }


                          @Override
                          public void onReadyForSpeech(
                              android.os.Bundle bundle) {
                          }


                          @Override
                          public void onBeginningOfSpeech() {
                          }


                          @Override
                          public void onRmsChanged(
                              float rmsdB) {
                          }


                          @Override
                          public void onBufferReceived(
                              byte[] buffer) {
                          }


                          @Override
                          public void onEndOfSpeech() {
                          }


                          @Override
                          public void onPartialResults(
                              android.os.Bundle bundle) {
                          }


                          @Override
                          public void onEvent(
                              int eventType,
                              android.os.Bundle params) {
                          }

                      }
                  );


                  Intent intent =
                      new Intent(
                          RecognizerIntent
                              .ACTION_RECOGNIZE_SPEECH
                      );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                      RecognizerIntent
                          .LANGUAGE_MODEL_FREE_FORM
                  );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_MAX_RESULTS,
                      3
                  );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_PARTIAL_RESULTS,
                      false
                  );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE,
                      Locale.getDefault()
                  );


                  listening = true;

                  recognizer.startListening(intent);
              }


              private void executeCommand(
                  String command) {

                  if (
                      command.contains("play") ||
                      command.contains("resume") ||
                      command.contains("चलाओ") ||
                      command.contains("चला")
                  ) {

                      MusicNotificationService
                          .sendCommand(
                              android.view.KeyEvent
                                  .KEYCODE_MEDIA_PLAY
                          );

                      return;
                  }


                  if (
                      command.contains("pause") ||
                      command.contains("stop") ||
                      command.contains("रुको") ||
                      command.contains("बंद")
                  ) {

                      MusicNotificationService
                          .sendCommand(
                              android.view.KeyEvent
                                  .KEYCODE_MEDIA_PAUSE
                          );

                      return;
                  }


                  if (
                      command.contains("next") ||
                      command.contains("अगला")
                  ) {

                      MusicNotificationService
                          .sendCommand(
                              android.view.KeyEvent
                                  .KEYCODE_MEDIA_NEXT
                          );

                      return;
                  }


                  if (
                      command.contains("previous") ||
                      command.contains("back") ||
                      command.contains("पिछला")
                  ) {

                      MusicNotificationService
                          .sendCommand(
                              android.view.KeyEvent
                                  .KEYCODE_MEDIA_PREVIOUS
                          );

                      return;
                  }


                  if (
                      command.contains("volume up") ||
                      command.contains("increase volume") ||
                      command.contains("आवाज बढ़ा")
                  ) {

                      AudioManager audio =
                          (AudioManager)
                          getSystemService(
                              AUDIO_SERVICE
                          );

                      audio.adjustStreamVolume(
                          AudioManager.STREAM_MUSIC,
                          AudioManager.ADJUST_RAISE,
                          AudioManager.FLAG_SHOW_UI
                      );

                      return;
                  }


                  if (
                      command.contains("volume down") ||
                      command.contains("decrease volume") ||
                      command.contains("आवाज कम")
                  ) {

                      AudioManager audio =
                          (AudioManager)
      
