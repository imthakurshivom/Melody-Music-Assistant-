name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Scaffold RN project
        run: npx react-native@0.74.5 init BuddyApp --package-name com.buddyapp

      - name: Copy custom files into scaffold
        run: |
          cp App.tsx BuddyApp/App.tsx
          mkdir -p BuddyApp/src
          cp -r src/* BuddyApp/src/
          mkdir -p BuddyApp/android/app/src/main/java/com/buddyapp
          cp android/app/src/main/java/com/buddyapp/MediaControlModule.kt BuddyApp/android/app/src/main/java/com/buddyapp/
          cp android/app/src/main/java/com/buddyapp/MediaControlPackage.kt BuddyApp/android/app/src/main/java/com/buddyapp/

      - name: Register native module & mic permission
        run: |
          cd BuddyApp
          sed -i '/return packages/i\        packages.add(com.buddyapp.MediaControlPackage())' android/app/src/main/java/com/buddyapp/MainApplication.kt
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>' android/app/src/main/AndroidManifest.xml

      - name: Install extra dependency
        run: cd BuddyApp && npm install @react-native-voice/voice

      - name: Build debug APK
        run: cd BuddyApp/android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buddy-app-debug-apk
          path: BuddyApp/android/app/build/outputs/apk/debug/app-debug.apk
